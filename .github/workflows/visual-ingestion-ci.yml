name: VINMERGE Visual Ingestion CI

on:
  push:
  pull_request:

jobs:
  visual-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile ingestion code
        run: python -m py_compile visual/ingestion/ingest_visual_assets.py visual/ingestion/test_ingest_visual_assets.py scripts/validate_visual_layer.py scripts/reconcile_lfs_master.py

      - name: Run ingestion unit tests
        working-directory: visual/ingestion
        run: python -m unittest -v

      - name: Validate ingestion manifest schema
        run: python -c "import json; from jsonschema import Draft202012Validator, FormatChecker; s=json.load(open('schema/vinmerge-visual-ingestion-manifest.schema.json')); d=json.load(open('visual/ingestion/ingestion-manifest.example.json')); Draft202012Validator(s, format_checker=FormatChecker()).validate(d); print('ingestion manifest schema validation passed')"

      - name: Build generated visual sidecar
        run: python visual/ingestion/ingest_visual_assets.py visual/ingestion/ingestion-manifest.example.json /tmp/visual-index.json

      - name: Validate generated visual sidecar
        run: python scripts/validate_visual_layer.py /tmp/visual-index.json

      - name: Reconcile authoritative LFS master against Phase-1 enrichment
        run: |
          python scripts/reconcile_lfs_master.py \
            catalog/VINMERGE_East_Africa_MASTER_CATALOG_825_CUMULATIVE_AI_IMAGE_PUBLIC_ENRICHMENT_2026-09-15.json \
            enrichment/phase1/VINMERGE_825_IDENTIFIER_SLICES_2026-09-19.json \
            /tmp/vinmerge-reconciliation-report.json

      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: vinmerge-lfs-reconciliation-report
          path: /tmp/vinmerge-reconciliation-report.json
          retention-days: 7

      - name: Export authoritative LFS catalogue
        run: |
          test -s catalog/VINMERGE_East_Africa_MASTER_CATALOG_825_CUMULATIVE_AI_IMAGE_PUBLIC_ENRICHMENT_2026-09-15.json
          sha256sum catalog/VINMERGE_East_Africa_MASTER_CATALOG_825_CUMULATIVE_AI_IMAGE_PUBLIC_ENRICHMENT_2026-09-15.json
          cp catalog/VINMERGE_East_Africa_MASTER_CATALOG_825_CUMULATIVE_AI_IMAGE_PUBLIC_ENRICHMENT_2026-09-15.json /tmp/VINMERGE_CURRENT_LFS_MASTER.json

      - name: Upload authoritative LFS catalogue
        uses: actions/upload-artifact@v4
        with:
          name: vinmerge-current-lfs-master
          path: /tmp/VINMERGE_CURRENT_LFS_MASTER.json
          retention-days: 7
