name: VinMerge Parts Reference Contract CI

on:
  push:
    paths:
      - "schema/vinmerge-parts-*.schema.json"
      - "examples/parts/**"
      - "scripts/validate_parts_contracts.py"
      - ".github/workflows/parts-reference-contract-ci.yml"
  pull_request:
    paths:
      - "schema/vinmerge-parts-*.schema.json"
      - "examples/parts/**"
      - "scripts/validate_parts_contracts.py"
      - ".github/workflows/parts-reference-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-parts-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile validator
        run: python -m py_compile scripts/validate_parts_contracts.py
      - name: Validate schemas and fixtures
        run: python scripts/validate_parts_contracts.py
